(function () {

  var PIN = null, colCb = null, refreshing = null;

    var res = await sb.rpc(fn, args);
    if (res.error) throw { code: 'unavailable', message: res.error.message };
    return res.data || {};
  }
  function emit(rows, fromCache) {
    if (!colCb) return;
    var meta = { fromCache: fromCache, hasPendingWrites: false };
    var docs = rows.map(function (r) { var d = Object.freeze(r.doc); return { id: r.id, exists: true, data: function () { return d; }, metadata: meta }; });
    colCb({ docs: docs, size: docs.length, empty: !docs.length, metadata: meta, docChanges: function () { return []; } });
  }
  async function refresh() {
    if (!PIN) { emit([], true); return; }
    if (refreshing) return refreshing;
    refreshing = (async function () {
      try {
        var r = await rpc('recrut_list', { p_pin: PIN });
        if (r.ok) emit(r.rows || [], false);
        else { PIN = null; emit([], true); }
      } catch (e) { /* hors ligne : on garde l'affichage */ }
      finally { refreshing = null; }
    })();
    return refreshing;
  }
  setInterval(function () { if (PIN && !document.hidden) refresh(); }, 20000);
  document.addEventListener('visibilitychange', function () { if (PIN && !document.hidden) refresh(); });

  function fail(r) { var e = (r && r.error) || 'upstream_error'; throw { code: e === 'bad_pin' || e === 'locked' ? 'revoked' : 'invalid_argument', message: e }; }
  function docRef(path) {
    var parts = path.split('/'), col = parts[0], id = parts[1];
    return {
      id: id, path: path,
      get: async function () { return { id: id, exists: false, data: function () { }, metadata: { fromCache: false } }; },
      set: async function (data) {
        if (col !== 'candidats') return;
        var res = await sb.from('recrut_candidats').insert({ id: id, doc: data });
        if (res.error) {
          if (res.error.code === '23505') return; /* déjà enregistré (relance) */
          throw { code: res.error.code ? 'invalid_argument' : 'unavailable', message: res.error.message };
        }
        if (PIN) refresh();
      },
      update: async function (patch) {
        if (col !== 'candidats') return;
        var r = await rpc('recrut_patch', { p_pin: PIN, p_id: id, p_patch: patch });
        if (!r.ok) fail(r);
        await refresh();
      },
      delete: async function () {
        if (col !== 'candidats') return;
        var r = await rpc('recrut_delete', { p_pin: PIN, p_id: id });
        if (!r.ok) fail(r);
        await refresh();
      },
      onSnapshot: function (cb) { setTimeout(function () { cb({ id: id, exists: false, data: function () { }, metadata: { fromCache: false } }); }, 0); return function () { }; }
    };
  }

    var c = {
      path: path,
      doc: function (id) { return docRef(path + '/' + (id || uuid())); },
      orderBy: function () { return c; }, where: function () { return c; }, limit: function () { return c; },
      onSnapshot: function (cb) { colCb = cb; setTimeout(refresh, 0); return function () { colCb = null; }; }
    };
    return c;
  };
  var db = sb ? { doc: docRef, collection: collection } : null;

  /* Documents (CV, permis…) : stockés dans la base, lisibles seulement avec le code */
  var blobs = new Map(), urls = new Map(), pending = new Set();
  function compressImg(file) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
        var cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));

        URL.revokeObjectURL(u); cv.toBlob(function (b) { b ? res(b) : rej({ code: 'unsupported_type' }); }, 'image/jpeg', 0.82);
      };

    });
  }
  function toB64(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1] || ''); }; r.onerror = rej; r.readAsDataURL(blob); }); }
  function fromB64(b64, ct) { var bin = atob(b64), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: ct }); }
  var assets = {
    upload: async function (file, opt) {
      opt = opt || {};
      var ct = file.type || '', blob = file;
      if (/^image\//.test(ct) || /\.(heic|heif|jpe?g|png|webp)$/i.test(file.name || '')) { blob = await compressImg(file); ct = 'image/jpeg'; }
      else if (ct !== 'application/pdf') throw { code: 'unsupported_type' };
      if (blob.size > 10 * 1024 * 1024) throw { code: 'too_large' };
      var r = await rpc('recrut_doc_add', { p_pin: PIN, p_cand: opt.cand, p_label: opt.label || '', p_name: file.name || '', p_ct: ct, p_data: await toB64(blob) });
      if (!r.ok) throw { code: r.error === 'too_large' ? 'too_large' : r.error === 'type' ? 'unsupported_type' : 'upstream_error' };
      blobs.set(r.id, blob);
      return { id: r.id, url: '', contentType: ct, sizeBytes: blob.size };
    },
    delete: async function (id) {

      blobs.delete(id); if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); }
      return { deleted: !!r.ok };
    }
  };
  async function docBlob(id) {
    if (blobs.has(id)) return blobs.get(id);
    var r = await rpc('recrut_doc_get', { p_pin: PIN, p_id: id });
    if (!r.ok) throw { code: 'not_found' };
    var b = fromB64(r.data, r.ct); blobs.set(id, b); return b;
  }
  function docUrl(id) {
    if (urls.has(id)) return urls.get(id);
    if (!pending.has(id) && PIN) {
      pending.add(id);
      docBlob(id).then(function (b) { urls.set(id, URL.createObjectURL(b)); pending.delete(id); try { render(); } catch (e) { } })
        .catch(function () { pending.delete(id); });

  }

    save: async function (o) {
      var blob = o.data instanceof Blob ? o.data : new Blob([o.data]);

    verify: async function (code) {
      if (!sb) return { ok: false, error: 'network' };
      try { var r = await rpc('recrut_check', { p_pin: code }); if (r.ok) { PIN = code; await refresh(); return { ok: true }; } return { ok: false, error: r.error }; }

    },
    out: function () { PIN = null; blobs.clear(); urls.forEach(function (u) { URL.revokeObjectURL(u); }); urls.clear(); emit([], true); },
    setPin: async function (n) { try { var r = await rpc('recrut_set_pin', { p_pin: PIN, p_new: n }); if (r.ok) PIN = n; return r; } catch (e) { return { ok: false, error: 'network' }; } },

})();

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: tablette d'abord — une colonne centrée pour le candidat, un tableau dense pour la RH */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F3F3F3; --ink:#111111; --muted:#5F5F5F; --line:#E2E2E2;
  --accent:#E2001A; --accent-soft:#FDE6E8; --accent-ink:#FFFFFF;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B26B00; --warn-soft:#FBEBD0; --bad:#C2332C; --bad-soft:#F8E1DF;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0D0D; --surface:#171717; --sunk:#222222; --ink:#F4F4F4; --muted:#A6A6A6; --line:#2F2F2F;
  --accent:#FF2D3D; --accent-soft:#3B1216; --accent-ink:#FFFFFF;
  --ok:#5DBB83; --ok-soft:#1C3326; --warn:#E6A440; --warn-soft:#3A2B12; --bad:#EE6B62; --bad-soft:#3D1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --surface:#171717; --sunk:#222222; --ink:#F4F4F4; --muted:#A6A6A6; --line:#2F2F2F;
  --accent:#FF2D3D; --accent-soft:#3B1216; --accent-ink:#FFFFFF;
  --ok:#5DBB83; --ok-soft:#1C3326; --warn:#E6A440; --warn-soft:#3A2B12; --bad:#EE6B62; --bad-soft:#3D1D1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
.wrap{max-width:880px;margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:13px;font-family:var(--mono);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);padding:12px 20px;border-radius:999px;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.qlabel{font-weight:600}
[hidden]{display:none!important}
.req::after{content:" *";color:var(--bad)}
.field.invalid input{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.field.invalid>label{color:var(--bad)}
.fielderr{color:var(--bad);font-weight:600;font-size:15px}
.hint{font-size:14px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;font:500 17px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:50px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-flex;align-items:center;min-height:46px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.opt input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--sunk)}
.progress{display:flex;gap:4px;margin:6px 0 4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.err{background:var(--bad-soft);color:var(--bad);padding:12px 14px;border-radius:10px;font-weight:600}
.note{background:var(--accent-soft);padding:14px 16px;border-radius:10px}
.q{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.calcq{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:14px;align-items:center;padding-block:14px;border-top:1px solid var(--line)}
.calcq:first-child{border-top:0}
@media (max-width:520px){.calcq{grid-template-columns:1fr}}
.money{position:relative}
.money input{padding-left:46px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.money::before{content:"CHF";position:absolute;left:12px;top:50%;transform:translateY(-50%);font:600 13px var(--mono);color:var(--muted)}
.langrow{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.langrow:first-child{border-top:0}
@media (max-width:620px){.langrow{grid-template-columns:1fr}}
.rule{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.rule:first-child{border-top:0;padding-top:0}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--ink);flex:none}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.hero{padding-block:28px 8px}
.home-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:28px}
@media (max-width:620px){.home-cards{grid-template-columns:1fr}}
.home-card{text-align:left;display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.home-card:hover{border-color:var(--muted)}
.home-card.feature{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.home-card.feature .muted{color:inherit;opacity:.7}
.home-card h2{font-size:26px}
/* RH */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar select,.toolbar input{width:auto;min-height:42px;font-size:15px;padding:8px 12px}
.toolbar input{flex:1;min-width:160px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.score{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--mono);font-weight:600;font-size:18px}
.score small{font-size:12px;color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.pill.gold{background:var(--accent-soft);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.detail-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
@media (max-width:620px){.detail-head{grid-template-columns:1fr}}
.bigscore{text-align:right}
.bigscore b{font-family:var(--mono);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.bigscore span{font-family:var(--mono);color:var(--muted);font-size:18px}
@media (max-width:620px){.bigscore{text-align:left}}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:170px minmax(0,1fr) 72px;gap:12px;align-items:center;font-size:15px}
@media (max-width:520px){.bar{grid-template-columns:110px minmax(0,1fr) 64px}}
.track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:5px}
.fill.pending{background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px)}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 16px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.ans{display:flex;flex-direction:column;gap:6px}
.ansline{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.ansline .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.mk.y{background:var(--ok-soft);color:var(--ok)}
.mk.n{background:var(--bad-soft);color:var(--bad)}
.quote{background:var(--sunk);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.alerts{display:flex;flex-wrap:wrap;gap:8px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating .chip span{min-width:46px;justify-content:center;font-family:var(--mono)}
.ratingrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.ratingrow:first-child{border-top:0}
@media (max-width:620px){.ratingrow{grid-template-columns:1fr}}
.overlay{position:fixed;inset:0;background:rgba(10,9,7,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:min(360px,100%);display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.pinshow{display:flex;justify-content:center;gap:12px}
.pinshow i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pinshow i.f{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:60px;font:600 22px var(--mono);border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:60}
.banner{background:var(--warn-soft);color:var(--warn);padding:12px 16px;border-radius:10px;margin-bottom:16px;font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.doc{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.doc .thumb{aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);text-decoration:none;font:600 18px var(--mono)}
.doc .thumb img{width:100%;height:100%;object-fit:cover}
.doc .meta{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 16px var(--body);color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.essai-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.essai-form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.essai-form{grid-template-columns:1fr}}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:960px){.week{grid-template-columns:1fr}.emptyday{display:none}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px;min-width:0}
@media (max-width:960px){.day{min-height:0}}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;text-transform:capitalize;color:var(--muted);font-weight:600;font-size:14px}
.dayhead b{font-size:20px;color:var(--ink)}
.dayempty{padding-top:4px}
.ecard{appearance:none;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;border-left:4px solid var(--accent);min-width:0;overflow-wrap:anywhere}
.ecard.reussi{border-left-color:var(--ok)}.ecard.absent{border-left-color:var(--bad)}.ecard.echec{border-left-color:var(--warn)}
.ecard:hover{border-color:var(--muted)}
.etime{font-size:13px;font-weight:600}
.later{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.lrow{appearance:none;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--line);display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:12px;padding:12px 16px;text-align:left;cursor:pointer}
.lrow:first-child{border-top:0}.lrow:hover{background:var(--sunk)}
@media (max-width:520px){.lrow{grid-template-columns:1fr;gap:2px}}
.pill.info{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:620px){.checklist{grid-template-columns:1fr}}
.check .pill{margin-left:4px}
.fsel{width:auto;min-height:42px;font-size:15px;padding:8px 12px}
.sigwrap canvas{display:block;width:100%;max-width:640px;aspect-ratio:3/1;background:#fff;border:2px dashed var(--muted);border-radius:12px;touch-action:none;cursor:crosshair}
.sigimg{display:block;max-width:300px;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:#fff}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:inline-block}}
:root[data-theme="dark"] .logo-l{display:none}
:root[data-theme="dark"] .logo-d{display:inline-block}
.brand img{flex:none}
@media (max-width:520px){.brand .muted{display:none}}
.idlewarn{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--accent);color:var(--accent-ink);padding:14px 22px;border-radius:999px;font-weight:700;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px);text-align:center}
.overlay.lock{z-index:48;background:rgba(10,10,10,.94)}
.oralhelp{background:var(--sunk);border-radius:10px;padding:12px 16px;font-size:15px}
.oralhelp ul{margin:6px 0 0;padding-left:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function scoreOf(c){
  const a=c.answers||{}, P={};
  if(isCuisine(c)){const kOk=CUISINE.filter((q,i)=>String(getP(a,"ktest."+i))===String(q.a)).length;P.calc={label:"Test cuisine",got:kOk*2.5,max:20}}
  else{const calcOk=CALC.filter((q,i)=>{const v=parseNum(getP(a,"calc.a."+i));return v!=null&&Math.abs(v-q.a)<0.011}).length;
  P.calc={label:"Calcul caisse",got:calcOk*2.5,max:20}}
  const frOk=FR_Q.filter((q,i)=>String(getP(a,"fr.q."+i))===String(q.a)).length;
  const frT=c.manual?.frText??c.ai?.fr?.score;
  P.fr={label:"Français écrit",got:frOk*1.4+(frT!=null?Math.min(8,Math.max(0,+frT)):0),max:15,pending:frT==null};
  const enOk=EN_Q.filter((q,i)=>String(getP(a,"en.q."+i))===String(q.a)).length;
  const enT=c.manual?.enText??c.ai?.en?.score;
  P.en={label:"Anglais écrit",got:enOk+(enT!=null?Math.min(5,Math.max(0,+enT)):0),max:10,pending:enT==null};
  const sOk=SITU.filter((q,i)=>String(getP(a,"situ."+i))===String(q.a)).length;
  P.situ={label:"Situations & hygiène",got:sOk*2.5,max:15};
  const m=(+(a.exp?.restoAns||0))*12+(+(a.exp?.restoMois||0));
  let e=a.exp?.duree!=null?(EXP_PTS[a.exp.duree]??0):(m<=0?0:m<6?3:m<12?5:m<24?7:9); if(a.exp?.caisse==="Oui")e+=1;
  P.exp={label:"Expérience",got:Math.min(10,e),max:10};
  const d=a.dispo||{}; let ds=0;
  if(d.weekend==="Oui"||d.weekend==="Oui, les deux")ds+=3;
  const cr=Array.isArray(d.creneaux)?d.creneaux.join(" "):String(d.creneaux||""); if(cr==="Les deux"||cr.includes("Soir")||cr.includes("Fermeture"))ds+=2;
  if((d.jours||[]).length>=5)ds+=2; else if((d.jours||[]).length>=3)ds+=1;
  if(d.libre==="Tout de suite")ds+=2; else if(d.libre==="Dans 1 à 2 semaines")ds+=1.5; else if(d.libre==="Dans 1 mois")ds+=1;
  if(d.vacances==="Non")ds+=1;
  P.dispo={label:"Disponibilité",got:Math.min(10,ds),max:10};
  const o=c.oral||{}; const vals=ORAL.map(([k])=>+o[k]).filter(v=>v>0); const arr=ARRIVEE.find(x=>x[0]===o.arrivee); if(arr)vals.push(arr[1]);
  P.oral={label:"Entretien oral",got:vals.length?vals.reduce((x,y)=>x+y,0)/vals.length/5*20:0,max:20,pending:!vals.length};
  const total=Object.values(P).reduce((s,p)=>s+p.got,0);
  return {P,total:Math.round(total),pending:Object.values(P).some(p=>p.pending)};
}
function alertsOf(c){
  const a=c.answers||{}, r=a.regles||{}, L=[];
  const pm=a.permis;
  if(pm==="Aucun permis")L.push(["bad","Pas d'autorisation de travail"]);
  else if(["Demande en cours","Permis N","Permis F","Permis S","Permis L"].includes(pm))L.push(["warn","Permis à vérifier ("+pm+")"]);
  if(a.sexe==="Homme"&&r.barbe==="Oui"&&r.barbeAction==="Non")L.push(["bad","Refuse de raser / couvrir la barbe"]);
  if(r.piercing==="Oui"&&r.piercingOk==="Non")L.push(["bad","Refuse d'enlever les piercings"]);
  if(r.tatouage==="Oui"&&r.tatouageOk==="Non")L.push(["bad","Refuse de couvrir les tatouages"]);
  if(r.cheveux==="Oui"&&r.cheveuxOk==="Non")L.push(["bad","Refuse d'attacher les cheveux"]);
  const ag=age(a.naissance); if(ag!=null&&ag<18)L.push(["warn","Mineur·e ("+ag+" ans) : horaires limités"]);
  if(a.dispo?.weekend==="Non")L.push(["warn","Pas dispo le week-end"]);
  if(a.dispo?.vacances==="Oui, déjà prévues")L.push(["warn","Vacances prévues"+(a.dispo.vacancesDates?" : "+a.dispo.vacancesDates:"")]);
  const s=scoreOf(c); if(s.P.calc.got<10)L.push(["warn",isCuisine(c)?"Test cuisine faible":"Calcul faible"]);
  const so=a.sorties||[]; if(so.length)L.push(["warn","A quitté l'app "+so.length+"× pendant le test"]);
  if(c.statut==="vivier"&&!a.consentVivier)L.push(["warn","Vivier sans accord du candidat"]);
  const dp=dupsOf(c); if(dp.length)L.push(["warn","Déjà postulé ("+dp.length+"×)"]);
  const ex=expireOf(c); if(ex){const dl=Math.ceil((ex-Date.now())/864e5);if(dl<=30)L.push(["warn","Suppression auto dans "+Math.max(0,dl)+" j"])}
  return L;
}

function exportSig(cv){const o=document.createElement("canvas");o.width=600;o.height=200;const x=o.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,600,200);x.drawImage(cv,0,0,600,200);return o.toDataURL("image/png")}
window.addEventListener("resize",()=>{if(view==="cand"&&$("#sig"))sigInit()});
function sigInit(){
  const cv=$("#sig");if(!cv)return;const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";
  if(draft?.answers?.signature){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height);img.src=draft.answers.signature}
  let drawing=false,last=null;const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
  cv.onpointerdown=e=>{drawing=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}last=pos(e);ctx.beginPath();ctx.arc(last.x,last.y,1.2,0,7);ctx.fillStyle="#111";ctx.fill();e.preventDefault()};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()};
  cv.onpointerup=cv.onpointercancel=cv.onpointerleave=()=>{if(!drawing)return;drawing=false;if(draft)draft.answers.signature=exportSig(cv)};
}

function avsVisible(){return avsRequired()||draft?.answers?.permis==="Permis G (frontalier)"}
const avsOk=v=>/^756\d{10}$/.test(String(v||"").replace(/[\s.]/g,""));
const visibleSteps=()=>STEPS.filter(s=>!(s.skip&&s.skip()));

function renderCandidat(){

function validateStep(){
  const s=visibleSteps()[step];
  const req=typeof s.req==="function"?s.req():s.req;
  const miss=req.filter(p=>{const v=getP(draft,p);return v==null||(typeof v==="string"&&v.trim()==="")||(Array.isArray(v)&&!v.length)});
  if(s.t==="Disponibilités"&&!(draft.answers.dispo?.jours||[]).length)miss.push("jours");
  if(miss.length){errorMsg="Merci de répondre à toutes les questions marquées d'une étoile.";return false}
  if(s.t==="Vous"){const ag=age(draft.answers.naissance);if(ag!=null&&ag<18){errorMsg="Il faut avoir au moins 18 ans pour postuler.";return false}}
  if(s.t==="Vous"){const v=draft.answers.avs;if(avsVisible()&&(avsRequired()||(v||"").trim())&&!avsOk(v)){errorMsg="Le numéro AVS doit commencer par 756 et contenir 13 chiffres (ex. 756.1234.5678.97).";return false}
   if(!avsVisible())delete draft.answers.avs;}
  if(s.t==="Vous"){const a=age(draft.answers.naissance);if(a!=null&&a<18){errorMsg="Il faut avoir au moins 18 ans pour postuler.";return false}if(a==null||a>80){errorMsg="Vérifiez la date de naissance.";return false}}
  errorMsg="";return true;
}

function render(){
  const y=window.scrollY;

  const keyNow=view+"|"+(currentId||"")+"|"+step, snap=keyNow===lastRenderKey?captureForm():null; lastRenderKey=keyNow;
  const lockOn=kiosk.locked&&candView();
  $("#app").innerHTML=(lockOn?'<div inert>'+V()+'</div>':V())+renderLock()+renderPin();
  restoreForm(snap);
  if(view==="cand")sigInit();

}
let lastRenderKey="";
function captureForm(){const root=$("#app");if(!root)return null;const vals={},act=document.activeElement;
  root.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{if(["checkbox","radio","file","hidden"].includes(el.type))return;
    const def=el.tagName==="SELECT"?([...el.options].find(o=>o.defaultSelected)||el.options[0]||{}).value:el.defaultValue;if(el.value!==def)vals[el.id]=el.value});
  root.querySelectorAll('input[type=radio][name^="es-"]:checked').forEach(el=>{if(!el.defaultChecked)vals["radio:"+el.name]=el.value});
  const focusable=act&&act.id&&root.contains(act)&&/^(INPUT|TEXTAREA)$/.test(act.tagName)&&!["checkbox","radio"].includes(act.type);
  return {vals,focus:focusable?act.id:null,sel:focusable&&act.selectionStart!=null?[act.selectionStart,act.selectionEnd]:null}}
function restoreForm(sn){if(!sn)return;for(const [k,v] of Object.entries(sn.vals)){if(k.startsWith("radio:")){const r=[...document.querySelectorAll('input[type=radio]')].find(x=>x.name===k.slice(6)&&x.value===v);if(r)r.checked=true;continue}
  const el=document.getElementById(k);if(el&&el.type!=="file")el.value=v}
  if(sn.focus){const el=document.getElementById(sn.focus);if(el&&!el.closest("[inert]")){el.focus({preventScroll:true});try{if(sn.sel)el.setSelectionRange(sn.sel[0],sn.sel[1])}catch(e){}}}}
function authOut(){try{window.__rh.out()}catch(e){}serverLoaded=false;lastPurge=0}

const IDLE_CAND=4*60e3, IDLE_RH=5*60e3, IDLE_WARN=60e3;
let kiosk={locked:false,reason:""}, lastAct=Date.now(), awayStart=0, fsOn=false, wakeLock=null;
const candView=()=>(view==="cand"||view==="intro")&&!!draft;
const rhView=()=>["rh","planning","vivier","detail","settings","oral"].includes(view);
const fmtDur=s=>s<60?s+" s":Math.floor(s/60)+" min "+pad(s%60)+" s";
function enterFS(){try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen({navigationUI:"hide"}).then(()=>{fsOn=true}).catch(()=>{})}catch(e){}}
async function wakeOn(){try{if(navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}}catch(e){}}
const warnEl=document.createElement("div");warnEl.className="idlewarn";warnEl.hidden=true;warnEl.setAttribute("role","alert");document.body.appendChild(warnEl);
function showWarn(sec){if(!sec){warnEl.hidden=true;return}warnEl.hidden=false;warnEl.textContent="Toujours là ? Touchez l'écran pour continuer. Verrouillage dans "+sec+" s."}
function lockKiosk(reason){if(!candView())return;try{document.activeElement&&document.activeElement.blur()}catch(e){}kiosk={locked:true,reason};showWarn(0);render()}
["pointerdown","keydown","input","wheel","touchstart"].forEach(t=>document.addEventListener(t,()=>{lastAct=Date.now();if(!warnEl.hidden)showWarn(0)},{capture:true,passive:true}));
setInterval(()=>{const idle=Date.now()-lastAct;
  if(candView()&&!kiosk.locked){if(idle>IDLE_CAND+IDLE_WARN)lockKiosk("Pas d'activité depuis plusieurs minutes.");else if(idle>IDLE_CAND)showWarn(Math.ceil((IDLE_CAND+IDLE_WARN-idle)/1000))}
  else if(rhUnlocked&&!candView()&&idle>IDLE_RH&&!pinCb){rhUnlocked=false;authOut();oralDraft=null;go("home");toast("Espace RH verrouillé après 5 minutes sans activité")}
  purgeExpired();
},1000);
document.addEventListener("visibilitychange",()=>{
  if(!candView())return;
  if(document.hidden){awayStart=Date.now();return}
  wakeOn();
  if(awayStart){const s=Math.max(1,Math.round((Date.now()-awayStart)/1000));(draft.answers.sorties||(draft.answers.sorties=[])).push({t:awayStart,s});awayStart=0;lockKiosk("L'application a été quittée pendant "+fmtDur(s)+".")}
});
document.addEventListener("fullscreenchange",()=>{if(document.fullscreenElement){fsOn=true;return}if(fsOn&&candView()&&!kiosk.locked){fsOn=false;lockKiosk("Le plein écran a été quitté.")}else fsOn=false});

    if(el.dataset.multi){const arr=(getP(oralDraft,el.dataset.o)||[]).filter(v=>v!==el.value);if(el.checked)arr.push(el.value);setP(oralDraft,el.dataset.o,arr)}

  else if(el.dataset.f){filt[el.dataset.f]=el.value;if(el.dataset.f==="q"){const pos=el.selectionStart;render();const n=$("#rh-q");if(n){n.focus();n.setSelectionRange(pos,pos)}}else render()}

    if(act==="manFr"||act==="manEn"){const k=act==="manFr"?"frText":"enText",v=el.value===""?null:+el.value;await db.doc("candidats/"+c.id).update({manual:{...(c.manual||{}),[k]:v}});toast("Note enregistrée")}

   case "tabListe":lastRH="rh";go("rh");break;

   case "weekPrev":weekStart=new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()-7);render();break;

function cleanAnswers(src){
  const a=JSON.parse(JSON.stringify(src||{})), d=a.dispo||{}, r=a.regles||{};
  const keep=new Set(Object.keys(a.langues||{}).filter(k=>a.langues[k]&&a.langues[k]!=="Non"));
  if(a.autres)for(const k of Object.keys(a.autres))if(!keep.has(k))delete a.autres[k];
  if(!keep.has("Autre"))delete a.autreLangue;
  if(d.vacances!=="Oui, déjà prévues")delete d.vacancesDates;
  if(!d.emploi||d.emploi==="Non"){delete d.preavis;delete d.parallele}
  if(a.sexe!=="Homme"){delete r.barbe;delete r.barbeAction}else if(r.barbe!=="Oui")delete r.barbeAction;
  if(r.piercing!=="Oui")delete r.piercingOk; if(r.tatouage!=="Oui")delete r.tatouageOk; if(r.cheveux!=="Oui")delete r.cheveuxOk;
  if(a.nationalite!=="Autre")delete a.nationaliteAutre; if(a.pays!=="Autre")delete a.paysAutre;
  return a;
}

  const all=pdf.getPages(),tag=pdfTxt("Chic Chicken · "+nomComplet(c));
  all.slice(0,nMain).forEach((p,i)=>{const t=tag+" · page "+(i+1)+" / "+nMain;p.drawText(t,{x:M,y:24,size:8,font:F,color:MUT})});
  return {bytes:await pdf.save(),missing};
}
async function exportCSV(){
  if(!downloads)return;
  const cols=["Nom","N° AVS","Téléphone","E-mail","Adresse","NPA","Ville","Pays","Restaurant","Poste","Date","Score","Provisoire","Statut","Permis","Âge","Langues","Week-end","Libre","Alertes"];
  const q=v=>{let t=String(v??"");if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
  const rows=filtered().map(c=>{const a=c.answers||{},s=scoreOf(c);return [nomComplet(c),a.avs,a.tel,a.email,a.adresse,a.npa,a.ville,a.pays==="Autre"?a.paysAutre:a.pays,c.resto,c.poste,fmtDate(c.createdAt),s.total,s.pending?"oui":"non",statutInfo(c.statut)[1],a.permis,age(a.naissance),Object.entries(a.langues||{}).filter(([,v])=>v&&v!=="Non").map(([l,v])=>l+" ("+v+")").join(" ; "),a.dispo?.weekend,a.dispo?.libre,alertsOf(c).map(x=>x[1]).join(" ; ")].map(q).join(";")});
  try{await downloads.save({filename:"candidats-chic-chicken.csv",data:"﻿"+[cols.map(q).join(";"),...rows].join("\n")})}
  catch(e){if(e?.code!=="declined")toast("Export impossible ici")}
}
